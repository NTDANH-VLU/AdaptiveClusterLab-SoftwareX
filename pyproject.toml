[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiveclusterlab"
version = "1.1.0"
description = "Reproducible benchmarks for adaptive and memory-aware clustering research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
research = ["torch>=2.0", "scipy>=1.10"]

[project.scripts]
adaptiveclusterlab = "adaptiveclusterlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
