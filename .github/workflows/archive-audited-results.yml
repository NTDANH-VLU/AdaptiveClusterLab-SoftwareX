name: Archive audited five-seed results in source repository
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-audited-results.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download independently verified result files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproducibility/audited-2026-11-17
          for dataset in retail damadics electricity; do
            mkdir -p "reproducibility/audited-2026-11-17/$dataset"
            gh run download 44039942375 -R "$GITHUB_REPOSITORY" \
              -n "$dataset-five-seed" \
              -D "reproducibility/audited-2026-11-17/$dataset"
          done
      - name: Validate and write origin manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, math
          root=Path("reproducibility/audited-2026-11-17")
          expected={"retail":(60,8), "damadics":(20,8), "electricity":(60,8)}
          for data,(n,policies) in expected.items():
              with (root/data/"evaluation.csv").open(newline="",encoding="utf-8") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==n*policies,(data,len(rows))
              assert sorted(set(row["seed"] for row in rows))==["42","43","44","45","46"]
              assert all(x in rows[0] for x in ("q_action_visited","q_coverage_fallback","test_degenerate","test_silhouette_valid"))
              report=json.loads((root/data/"audit_report.json").read_text())
              assert len(report["methods"])==8
          paths=sorted(x for x in root.rglob("*") if x.is_file())
          hashes={str(x.relative_to(root)):hashlib.sha256(x.read_bytes()).hexdigest() for x in paths}
          manifest={
              "verified_workflow_run":44039942375,
              "verified_workflow_commit":"e60c71aa68494d6dc1e7d618464485197ac682d8",
              "seeds":[42,43,44,45,46],"cost_mode":"operation_counts",
              "ae_full_epochs":2,"ae_update_epochs":1,
              "method":"audited Q-learning and trained-action coverage ablations",
              "note":"Historical v1.0.0 release does not include this protocol. See main or a pinned audited commit.",
              "sha256":hashes}
          (root/"PROVENANCE.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("Validated",sum(expected[x][0]*expected[x][1] for x in expected),"rows and",len(paths),"files")
          PY
      - name: Commit verified CSV and manifest on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reproducibility/audited-2026-11-17/
          if ! git diff --cached --quiet; then
            git commit -m "data: archive independently validated eight-policy five-seed experiment outputs"
            git push origin HEAD:main
          fi
